<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BotTrading | Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #0f172a; color: #e6eef8; }
    h1 { color: #7dd3fc; }
    #log { margin-top: 16px; max-width: 920px; }
    .msg { padding: 12px; border-radius: 8px; margin-bottom: 8px; background: #1e293b; }
    .meta { color: #9aaed0; font-size: 12px; margin-top: 5px; }
    .info { padding: 10px 0; }
  </style>
</head>
<body>
  <h1>BotTrading | Panel de mercado</h1>
  <p>Eventos de mercado: no son señales de compra o venta.</p>
  <div id="source" class="info">Consultando fuente de datos...</div>
  <div id="status" class="info" role="status">Conectando WebSocket...</div>
  <div id="log" aria-live="polite"></div>
  <script>
    "use strict";
    const log = document.getElementById("log");
    const statusNode = document.getElementById("status");
    const sourceNode = document.getElementById("source");

    fetch("/source")
      .then(response => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(info => {
        sourceNode.textContent = "FUENTE: " + String(info.data_source).toUpperCase() +
          " | ÓRDENES REALES: DESHABILITADAS";
      })
      .catch(() => { sourceNode.textContent = "FUENTE: NO VERIFICADA"; });

    function addMessage(event) {
      const price = Number(event.price);
      const volume = Number(event.volume);
      const ts = Number(event.ts);
      if (!Number.isFinite(price) || !Number.isFinite(volume) || price <= 0 || volume <= 0) return;
      const line = document.createElement("div");
      line.className = "msg";
      const heading = document.createElement("div");
      heading.textContent = String(event.symbol || "?") + " | Precio: " +
        price.toLocaleString() + " | Volumen: " + volume.toLocaleString();
      const detail = document.createElement("div");
      detail.className = "meta";
      detail.textContent = (Number.isFinite(ts) ? new Date(ts * 1000).toLocaleString() : "Sin hora") +
        " | " + String(event.note || event.source || "Fuente desconocida");
      line.append(heading, detail);
      log.prepend(line);
      while (log.children.length > 50) log.lastChild.remove();
    }

    function connect() {
      const scheme = location.protocol === "https:" ? "wss://" : "ws://";
      const ws = new WebSocket(scheme + location.host + "/ws/signals");
      ws.addEventListener("open", () => { statusNode.textContent = "WebSocket conectado"; });
      ws.addEventListener("close", () => { statusNode.textContent = "WebSocket desconectado; recarga para reintentar"; });
      ws.addEventListener("error", () => { statusNode.textContent = "Error de WebSocket"; });
      ws.addEventListener("message", message => {
        try { addMessage(JSON.parse(message.data)); }
        catch (error) { console.warn("Mensaje inválido", error); }
      });
      setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send("ping"); }, 20000);
    }
    connect();
  </script>
</body>
</html>
